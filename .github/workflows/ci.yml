name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run validate:config
        env:
          DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/223456789012345678/ci-placeholder
          FRIENDS_JSON: "[]"
      - run: npm audit
      - run: npm run deploy:dry-run
        env:
          DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/223456789012345678/ci-placeholder
          FRIENDS_JSON: "[]"
